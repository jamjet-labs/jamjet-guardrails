[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jamjet-guardrails"
version = "0.3.0"
description = "Content guardrails for LLM applications, with published precision and recall and provenance on every decision."
readme = "README.md"
# Three licences, and each AND names material this distribution carries beyond
# its own code.
#
#   Apache-2.0    every line of code in this repository.
#   CC-BY-4.0     `corpora/pii/third-party.jsonl`, 300 rows derived from
#                 nvidia/Nemotron-PII. Sdist only.
#   Unicode-3.0   `unicode-data/16.0.0/`, the four files published by Unicode,
#                 Inc., in the sdist; AND `src/jamjet_guardrails/_unicode/`,
#                 which is generated from them and is therefore derived from
#                 them, in BOTH artifacts. The first draft of this comment said
#                 the wheel was Apache-2.0 alone because "a table of code point
#                 ranges derived from a data file is not that data file". It is
#                 the same data re-encoded, the Unicode License v3 grants the
#                 right to modify and redistribute on exactly the condition
#                 that its notice travels, and a project that ships a derived
#                 table under a licence field that does not name its source has
#                 made this file's own argument and not applied it to itself.
#
# The Unicode License v3 is satisfied where its notice "appear[s] with all
# copies of the Data Files or Software" or "in associated Documentation".
# `corpora/NOTICE.md` carries the notice verbatim and travels in the sdist
# beside the files; the README's licence section carries the pointer and is
# embedded in the wheel's own METADATA, so it reaches an installer who never
# sees this repository.
#
# The distribution as a whole is a combination and the SPDX expression has to
# say so. NOTICE.md travelling beside these files is what makes the legal chain
# hold; what did not hold before was the licence FIELD, which is the one line
# most consumers read.
#
# This document argues the same point against someone else. `docs/conformance.md`
# rejects two otherwise-ideal corpora because "an Apache-2.0 tag downstream does
# not cure a share-alike upstream, and no licence field anywhere in that chain
# reveals it". A project that says that and then ships a CC-BY corpus under a
# bare `Apache-2.0` has made the argument and not applied it to itself.
#
# The alternative was to drop `corpora/` and `unicode-data/` from the sdist.
# Rejected twice over: the sdist ships the tests, and the tests ARE the corpora
# for anything that scores; and the raw Unicode files are the evidence a reader
# regenerates the vendored tables from, which is the only way to check that
# what the package matches on is what Unicode published.
license = "Apache-2.0 AND CC-BY-4.0 AND Unicode-3.0"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Sunil Prakash" }]
# What somebody types into a search box, not what we call things internally.
# "prompt-injection" and "llm-security" are the two highest-intent terms this
# package can honestly claim and neither was here; a reader searching PyPI for
# either found nothing. Every term below is backed by a shipped check with a
# published row, which is the same bar the README copy is held to.
keywords = [
  "llm",
  "llm-security",
  "llm-guardrails",
  "guardrails",
  "prompt-injection",
  "pii",
  "redaction",
  "secrets",
  "content-filter",
  "safety",
]
# Every "Programming Language :: Python" entry here is a support claim, and
# tests/test_packaging.py holds it to the CI matrix: a version claimed and not
# tested is a claim we cannot back, shown to everyone who opens the PyPI page.
# 3.11 and 3.12 were added to the matrix rather than dropped from this list,
# because `requires-python = ">=3.10"` lets pip install onto them either way.
#
# There is deliberately NO "License :: OSI Approved" classifier. The SPDX
# `license` field above is authoritative under PEP 639 and hatchling emits it
# verbatim as `License-Expression` in Metadata-Version 2.5, which is where a
# consumer reads the licence from. A duplicate classifier is the deprecated
# spelling of the same fact and can only disagree with it.
#
# Nothing local enforces that. Measured rather than assumed: adding the
# classifier back builds cleanly under hatchling 1.32.0 and passes `twine
# check`. It is left out on the merits, not because a tool refuses it.
#
# "Typing :: Typed" is a claim too, and py.typed below is what makes it true.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jamjet-labs/jamjet-guardrails"
Repository = "https://github.com/jamjet-labs/jamjet-guardrails"
Issues = "https://github.com/jamjet-labs/jamjet-guardrails/issues"
Benchmarks = "https://github.com/jamjet-labs/jamjet-guardrails/blob/main/BENCHMARKS.md"

[project.optional-dependencies]
# Test-only, every one of them. The zero-dependency promise this package makes
# is `dependencies = []` above, and it is checked against the BUILT metadata by
# tests/test_packaging.py::test_the_installed_distribution_declares_no_runtime_dependencies,
# which filters out `extra ==` markers. So an entry here cannot reach a
# consumer's environment, and adding one is not a step towards a runtime
# dependency; it is the mechanism that keeps the two apart.
#
# pyyaml reads training/sources.yaml. tests/test_training_data.py is the licence
# and contamination screen over that manifest, CI installs `.[dev]`, so the
# screen runs on every leg. types-PyYAML is what lets `mypy --strict` see the
# library at all: PyYAML ships no py.typed, and without the stubs the bare
# `import yaml` in training/fetch.py fails the gate.
#
# hatchling is here so `tests/test_packaging.py` can BUILD the sdist and the
# wheel and look inside them. It is already this project's build backend, named
# under [build-system] above, so it is not a new third party; what is new is
# that the test suite needs it importable rather than only present in pip's
# isolated build environment. That is what turns "the wheel is built from the
# package directory alone" from a claim about pyproject.toml into a claim about
# an artifact, which is the difference between reading the configuration and
# opening the archive.
# hypothesis generates the inputs nobody wrote down. Every Critical this
# package has recorded was a CLASS of input rather than a wrong answer on a
# case somebody thought of: a decoy of the same shape in front of a real
# credential, two spans overlapping where one was kept and one dropped, a fold
# that changes length in either direction. Each is a short counterexample to an
# invariant `docs/conformance.md` already states, and each shipped past a suite
# that grew to 1845 hand-written cases. It is a dev extra like the four above,
# so it cannot reach a consumer's environment either, and
# tests/test_packaging.py::test_the_installed_distribution_declares_no_runtime_dependencies
# reads the BUILT metadata and filters `extra ==` markers, which is what proves
# the shipped wheel still declares no runtime dependency at all. It ships
# py.typed, so `mypy --strict` needs no stub package beside it.
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyyaml>=6",
  "types-PyYAML>=6",
  # `tests/test_packaging.py` builds the sdist and the wheel and opens both.
  # `python -m build --no-isolation` uses the hatchling below rather than
  # downloading a build environment, so the test needs no network; hatchling
  # is the backend `[build-system]` already names and is pinned by neither.
  "build>=1",
  "hatchling>=1.24",
  "hypothesis>=6.100",
]

[project.scripts]
jamjet-guardrails = "jamjet_guardrails.eval.cli:main"

[tool.hatch.build.targets.sdist]
# The raw Unicode files, force-included so that no later ignore rule can drop
# them. They are in the sdist and NOT in the wheel, and the asymmetry is the
# point: an installer gets the generated tables, and a reader gets the four
# published files those tables were derived from, so the derivation can be
# rerun and diffed. The sdist is the evidence.
#
# `artifacts` rather than `include`, and the difference is not cosmetic. An
# `include` list turns the sdist into an allowlist and would silently drop
# `corpora/`, `tests/` and `training/`, which are the sdist's other reason to
# exist. `artifacts` adds to what the VCS walk already found and takes nothing
# away; it is the same mechanism the wheel target below uses for py.typed.
#
# What actually holds the property is
# tests/test_packaging.py::test_the_built_sdist_carries_the_pinned_unicode_data,
# which builds the archive and reads its member list. This line states the
# requirement so that the day someone adds an ignore rule or an `include` list,
# there is something here to have contradicted.
artifacts = ["unicode-data/"]

[tool.hatch.build.targets.wheel]
# `src/jamjet_guardrails` and nothing else, which is also what keeps
# `unicode-data/` out of the wheel: 1.4 MB of raw text that no installed code
# reads, since the generator that reads it runs from a checkout and the tables
# it produced are already inside the package. Asserted against the built
# archive by tests/test_packaging.py::test_the_built_wheel_carries_no_raw_unicode_data.
packages = ["src/jamjet_guardrails"]
# PEP 561. Without this marker in the BUILT distribution, a consumer's type
# checker must ignore this package entirely: downstream `mypy --strict` reports
# import-untyped and every symbol degrades to Any, which disables exactly the
# static checking `Kind`, `Direction` and the `Guardrail` protocol exist to
# provide. This repo's own gate cannot see that, because `mypy` reads the source
# tree rather than an installed distribution.
#
# This line is NOT what puts the marker in the wheel, and saying so matters
# because it changes where the real guard has to live. Measured on hatchling
# 1.32.0: delete the line, rebuild, and py.typed is still in the wheel, because
# it sits inside the package directory and nothing excludes it. The line states
# the requirement so that a later exclusion rule cannot drop it in silence. What
# actually checks the shipped artifact is the release workflow, which asserts
# py.typed is inside the wheel before anything is published.
artifacts = ["src/jamjet_guardrails/py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff >=0.16 includes "*.md" by default and reformats Python blocks inside it.
# Documentation snippets are illustrative, not source; keep ruff to real Python.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint.isort]
# `training/` is this repository's, not a third-party package. Without this its
# imports sort into the third-party block and `ruff format --check` disagrees
# with `ruff check` about where they belong. `src` above cannot say it: the
# training tree sits at the repository root, and adding "." there would make
# every top-level directory a first-party module name.
known-first-party = ["training"]

[tool.mypy]
strict = true
# Tests too, not just src. The doubles annotate every protocol member because a
# bare `kind = "constraint"` infers `str` and does not satisfy Guardrail -- an
# annotation nothing checks is a comment. Note that a path argument on the mypy
# command line OVERRIDES this list, so CI runs a bare `mypy`.
# `training` is here so the tree that tests/test_training_data.py imports is
# checked too, and so mypy can resolve that import at all: without it, the
# module search path is derived from src/ and tests/ alone and `training`
# reports as a missing stub.
files = ["src", "tests", "training"]
# Typecheck against the declared floor, not whatever interpreter happens to run.
# Typeshed's version gates then catch stdlib used above the supported minimum.
python_version = "3.10"

# The training tree's machine learning imports, and only those. `training/train.py`
# needs torch, transformers, numpy and scikit-learn, and `training/export.py`
# adds onnx and onnxruntime; none of them is installed in `.venv` or in CI,
# because the separate `.venv-training` is the whole mechanism that keeps
# `dependencies = []` true. Without this a bare `mypy` fails on an import it is
# not supposed to be able to resolve, which would make the type gate depend on
# somebody having installed a gigabyte of torch. Every other strict setting
# stays on for these modules and for every other module in the tree.
#
# This list is a permission to be unable to RESOLVE an import, and it is not a
# permission to depend on one. `training/measure.py` imports numpy and
# onnxruntime inside the functions that use them rather than at the top, so the
# windowing rules 2b-2 ports stay importable and testable where neither is
# installed; that is a property of that module, not of this table.
[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
  "onnx",
  "onnx.*",
  "onnxruntime",
  "onnxruntime.*",
  "sklearn",
  "sklearn.*",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root on sys.path, so `tests/test_training_data.py` can import
# `training`. NOT redundant with running `python -m pytest`, which inserts the
# working directory itself: CI runs the bare `pytest` console script, which
# does not, so without this the training screens would fail to collect on every
# CI leg while passing locally.
pythonpath = ["."]

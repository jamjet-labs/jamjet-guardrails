- name: xTRam1/safe-guard-prompt-injection
  url: "https://huggingface.co/datasets/xTRam1/safe-guard-prompt-injection/resolve/a3a877d608f37b7d20d9945671902df895ecdb46/README.md"
  license: none-declared
  sha256: "unavailable"
  role: excluded
  note: >
    No licence at all: no tag on the repository and no licence field on the
    card, read 2026-09-01. Silence is not permission, so the allowlist refuses

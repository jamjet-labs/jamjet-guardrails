  sha256: "unavailable"
  role: excluded
  note: >
    Non-commercial. Licence tag read on 2026-09-01. This is the most obvious
    ready-made injection benchmark on the hub and it is written down for
    exactly that reason: NC excludes the people this library is published for,
    and a model fitted on it could not ship inside an Apache-2.0 distribution.
    Also gated -- an unauthenticated request for the pinned file answered HTTP
    401 on 2026-09-01 -- so it could not have been hashed even had the licence

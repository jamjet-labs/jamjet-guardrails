# --------------------------------------------------------------------------
# Usable for evaluation. One entry, and it is on the contamination denylist.
#
# Read the note below before reading any number measured through it. The full
# argument is in training/evalset.py; the exemption is enumerated in
# tests/test_training_data.py, which refuses any other denylisted corpus in
# this role.
# --------------------------------------------------------------------------

- name: jackhhao/jailbreak-classification
  url: "https://huggingface.co/datasets/jackhhao/jailbreak-classification/resolve/2f2ceeb39658696fd3f462403562b6eea5306287/default/jailbreak_dataset_full.csv"
  license: Apache-2.0
  sha256: "79a7b90b0abe00e3586cc5048353c3236543cca228a1ee261fe3b57a7cb7e29f"
  role: eval
  note: >
    THE EVALUATION CORPUS, and ProtectAI's v2 card names it as that model's own
    training data. Both halves of that sentence are true and the second is not a
    reason to refuse it here.
    Why the evaluation set is not a held-out slice of our synthetic rows. That
    corpus is separable by register: a classifier reading no content word at all
    scores 0.848 within a pair against 0.907 for a full bag of words. One
    generator writing both labels produces register that correlates with the
    label, and no wording escapes it, because making the twins more alike
    creates near-duplicate leakage across any split instead. Scored on its own
    held-out half, a fine-tuned encoder could take its number from an artifact
    the reference models have never seen, and the ship bar would be measuring
    artifact exploitation rather than detection.
    Why contamination is acceptable HERE and nowhere else in this file.
    Contamination in an evaluation set biases towards whichever model memorised
    it. DeBERTa may have these rows; our encoder has seen none of them. So a win
    for us is meaningful and a loss is inconclusive, and a gate that can fail us
    unfairly but never pass us unfairly is the correct asymmetry for a ship bar.
    Reverse the roles -- train on this and evaluate elsewhere -- and the
    asymmetry reverses with them, which is why
    test_no_corpus_is_both_an_exempted_eval_source_and_a_training_source exists.
    A third caveat, read off its own card on 2026-09-02 rather than assumed: its
    jailbreak rows come from the jailbreak_llms collection and its benign rows
    from OpenOrca and GPTeacher, so the label here correlates with the upstream
    source too. That is a limit on what any number measured on it shows, and it
    is the same objection the zn candidate below is refused on. The difference
    is that this corpus is the reference model's own training distribution,
    which is what makes the asymmetry above hold; the objection therefore
    weakens a win rather than manufacturing one.
    Two further caveats, and neither is small. This is JAILBREAK classification,
    which
    is adjacent to prompt injection and not the same task, and it sits inside
    the reference model's own training distribution, so it is maximally
    favourable to the reference on both counts at once. And the external
    evaluation rests on this one corpus; the candidates screened for a second
    are recorded below with what refused each.
    Pinned to the dataset repository's commit
    2f2ceeb39658696fd3f462403562b6eea5306287 and to one file within it rather
    than to the landing page the plan quoted: a branch name moves, and a landing
    page downloads HTML whose hash says nothing about the corpus. Read
    2026-09-01, 2143822 bytes, 1998 rows, 1332 benign and 666 jailbreak.
    Re-fetched and value-screened on 2026-09-01 and again on 2026-09-02: the
    recorded digest still describes what the pinned URL serves, and no
    fingerprint matched over 12,006 lines. The licence is the dataset
    repository's own apache-2.0 tag, which agrees with ProtectAI's card, and it
    carries an attribution condition that corpora/NOTICE.md discharges.
    Content-screened against the training data on 2026-09-02 rather than trusted
    to be different: training/evalset.py compares every eval row against the
    synthetic corpus and every role train source here, exact and near-duplicate,
    and the finding is recorded in training/generated/splits.json.

# --------------------------------------------------------------------------
# Excluded on values. The licence field passed; the rows did not.
# --------------------------------------------------------------------------

- name: beki/privy
  url: "https://huggingface.co/datasets/beki/privy/resolve/dc137a6a976f6b5bb8768e9bb51ec58df930ccd1/privy-dataset.zip"
  license: MIT
  sha256: "ad4ffbc8f7102a92f01f8d8023ddf4f5244fea6b23c3f116641fe6bbd8cbbde4"
  role: excluded
  note: >
    The worked example, and the reason training/screen.py exists at all. Its
    licence field PASSES: MIT is on the allowlist, and a screen that read only
    the metadata would have admitted this corpus. Its values do not pass.
    Screened on 2026-09-01 over dev-small.json, the smallest member of the
    pinned 307,518,080-byte archive: 1,068 of 3,101,988 lines carry a Fake Name
    Generator house domain. FNG identities are dual GPLv3 / CC-BY-SA-3.0-US,
    an MIT tag downstream does not cure a share-alike upstream, and the count
    is recorded here rather than the rows themselves.
    Kept in this file rather than dropped from it: this is the second time the
    corpus has been proposed and refused, and an exclusion nobody wrote down
    gets re-argued from the licence tag every time.

# --------------------------------------------------------------------------
# Excluded on licence. Refused before being fetched, so there is nothing to

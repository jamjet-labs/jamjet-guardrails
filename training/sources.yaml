# Every corpus this tree may touch: where it came from, what licence it
# carries, what it hashed to when it was read, and what it may be used for.
#
# `role` is the field that does the work.
#   train     usable for fitting the classifier
#   eval      usable for scoring it
#   excluded  neither, with the reason recorded here rather than remembered
#
# Read by training/fetch.py, which validates this file at load rather than
# trusting it, and screened by tests/test_training_data.py in CI.
#
# A corpus gets here by passing two screens, and training/screen.py holds both
# because Phase 1 showed that only one of them is a licence field.
#
#   licence_refusal  an ALLOWLIST over the `license` field. Non-commercial,
#                    share-alike, research-only, undeclared and self-
#                    contradicting all come out the same way: no established
#                    grant, no use. An identifier the allowlist does not
#                    recognise is refused rather than assumed permissive.
#   fingerprint_hits a screen over the corpus VALUES. `beki/privy` below is
#                    what it is for: MIT on the tag, Fake Name Generator
#                    identities in the rows, dual GPLv3 / CC-BY-SA-3.0-US
#                    upstream, and no licence field anywhere saying so.
#
# Every licence below was read from the source's own dataset card on
# 2026-09-01 and the date is recorded per entry, because a card can be edited
# and a licence taken from one without a date is a licence nobody can re-check.
#
# ONE SOURCE HERE CARRIES `role: eval`, AND ITS CARD NAMES IT AS A REFERENCE
# MODEL'S TRAINING DATA. That is deliberate, it is the opposite of what an
# earlier revision of this header decided, and the reasoning is written out at
# the entry itself and in training/evalset.py because on its face it is the
# exact mistake every screen in this file exists to prevent.
#
# The short form. The synthetic corpus TRAINS and a public corpus EVALUATES,
# because the synthetic corpus is separable by register and cannot grade
# itself: a classifier reading no content word scores 0.848 within a pair on
# it. And contamination in the EVALUATION set biases towards the REFERENCE
# model, never towards ours, since ours has seen none of those rows. A gate
# that can fail us unfairly and cannot pass us unfairly is the right asymmetry
# for a ship bar.
#
# What that does not do is make the denylist safe to ignore. It is the union of
# what two ProtectAI cards name, 19 datasets, and v2's own licence summary
# counts 22 while naming 7. So 15 corpora that model was trained on are named
# nowhere. A corpus absent from the denylist is one nobody has established the
# provenance of, not one the denylist cleared. The exemption is enumerated in
# tests/test_training_data.py as CONTAMINATED_EVAL, one name with a written
# reason, and every other denylisted corpus is refused in role eval exactly as
# before.

# --------------------------------------------------------------------------
# Usable for training.
# --------------------------------------------------------------------------


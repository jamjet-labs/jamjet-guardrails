- name: tljohnsilver/zn-prompt-injection-bench
  url: "https://huggingface.co/datasets/tljohnsilver/zn-prompt-injection-bench/resolve/eafc6c25439688f3a3b2bd727810ad5815f97354/data/corpus_v15.csv"
  license: CC-BY-4.0
  sha256: "a5f82345f1213f0569e652c494571771ef5efef8f42b1a7898435149b22140f3"
  role: excluded
  note: >
    The closest thing to a second evaluation corpus that was found, and the
    beki/privy lesson refuses it. Card read 2026-09-02: the corpus-level tag is
    cc-by-4.0, which the allowlist accepts, 23,699 rows split 12,317 attack to
    11,382 benign, documented in more detail than anything else screened here
    and value-screened clean over all 23,699 rows on 2026-09-02, no fingerprint
    matched.
    Its own `license` column is what refuses it. The corpus preserves the
    upstream licence of every row and its card says outright that those upstream
    terms continue to govern the underlying text, and 7,249 of the 23,699 rows
    carry a licence this repository cannot ship under: 2,209 CC-BY-SA-3.0, 1,551
    dual CC-BY-SA-3.0 with GFDL, 1,541 ODC-BY without a version, 1,529 PSF, 273
    IETF Trust Legal Provisions and 146 marked US public domain. Share-alike
    upstream is not cured by a permissive tag downstream. That is the same
    finding as beki/privy reached by a shorter route: here the corpus tells you
    itself rather than having to be caught.
    A licence-filtered subset is available in principle -- the 16,450 rows
    tagged MIT, CC-BY-4.0 or Apache-2.0 -- and it is not taken here, because
    building an evaluation corpus by filtering somebody else's on a column of
    their own licence claims is a provenance argument resting entirely on that
    column, and the corpus this repository would then publish numbers against is
    one no card describes. Written down so that a later task can weigh it rather
    than rediscover it.
    A second objection, recorded because the licence one may some day be
    answered. Its benign rows and its attack rows come from disjoint upstream
    corpora, so the label correlates with the source, and that is the same
    defect that disqualified our own synthetic rows from grading themselves.

- name: hse-llm/prompt-injections
  url: "https://huggingface.co/datasets/hse-llm/prompt-injections/resolve/6619b5e0f7a907404b8b81df6aa97c2114dd27a1/prompts_injection_50_50.csv"
  license: MIT
  sha256: "c8f858138dc30ac18d942cd66d82947d1c85aeb85016909318de991501bdacd2"
  role: excluded
  note: >
    MIT, on the allowlist, fetched and hashed on 2026-09-02, and refused on
    construction. Its three columns are "Malicious prompts", "Safe prompt
    DeepSeek" and "Safe prompt Llama": the attacks are collected and the
    negatives were written for the corpus by two language models. A negative
    class produced by a generator and a positive class that was not is the
    register artifact this whole stage is arranged around, and measuring on it
    would reward whichever model best recognises how a chat assistant writes.
    Its card is a licence tag and nothing else -- no description, no provenance,
    no collection method -- so there is also nothing to establish where the
    attacks came from or whether a reference model has seen them.

- name: Lakera/mosscap_prompt_injection
  url: "https://huggingface.co/datasets/Lakera/mosscap_prompt_injection"
  license: MIT
  sha256: "unavailable"
  role: excluded
  note: >
    MIT, real attacker traffic against a live target, and not fetched, so there
    is nothing to hash. Card read 2026-09-02. Two reasons, either alone enough.
    It is published only as parquet and this tree's pins carry no parquet reader
    -- training/requirements.txt lists neither pandas nor pyarrow -- so it could
    not be value-screened, which is the same ground the deepset entry above
    records. And it is single-class: every row is an attempt to talk a model out
    of a password, with no negatives, so it can measure recall and says nothing
    about precision. Pairing it with negatives from somewhere else would build
    exactly the source-correlated label the entry above is refused for.
    Recorded rather than dropped because it is the most interesting corpus
    screened here: not synthetic, not scraped, and produced by people actually
    trying. If a parquet reader ever enters this tree it is worth reading again.

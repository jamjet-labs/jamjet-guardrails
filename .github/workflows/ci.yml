# Every `uses:` in this repository is pinned to a full commit SHA, never to a
# tag. A tag is a movable pointer, so pinning one hands whoever can move it the
# ability to run new code inside a job that builds and publishes this package.
# The trailing comment names the release the SHA belongs to, because a bare
# forty-character hash is unreadable at bump time and an unreadable pin is one
# nobody bumps.
#
# TO BUMP ONE. `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` gives
# `.object.sha`. If it also reports `"type": "tag"` the ref is ANNOTATED and
# that SHA is the tag OBJECT, which `uses:` cannot resolve; dereference it with
# `gh api repos/<owner>/<repo>/git/tags/<sha>` and pin the commit it names.
# Both spellings are in use here: the `actions/` tags are lightweight and
# resolve in one call, the PyPI publisher's are annotated and need the second.
# Change the trailing comment in the same edit. `tests/test_workflows.py` fails
# if a `uses:` is not a forty-hex SHA, and fails again if it carries no version
# comment.
name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Bare `mypy`, no path: a path argument overrides [tool.mypy] files and
      # would silently drop tests/ from the check.
      - run: mypy
      - run: pytest -q
      # No `eval` subcommand. The console script takes flags only, and
      # `jamjet-guardrails eval ...` exits 2 with "unrecognized arguments: eval"
      # having measured nothing. That direction is at least loud, but the step
      # would be red on every run for a reason that has nothing to do with a
      # benchmark, which is its own way of making a gate stop meaning anything.
      #
      # Runs on EVERY matrix leg, and every leg regenerates and diffs the same
      # two files. That is safe because generation is deterministic: the report
      # sorts its rows explicitly rather than taking filesystem order, and the
      # artifacts were compared byte for byte across 3.10.20, 3.13.2 and 3.14.5
      # and across PYTHONHASHSEED 0, 1 and 12345.
      #
      # Running it on every leg anyway is the point rather than the cost. That
      # byte-identity is a property of today's detectors and today's report, not
      # a guarantee: a regex, a dict iteration or a float repr that differs by
      # version would move a published number on one leg only. Measuring it once
      # here proves it holds now; running every leg is what keeps proving it.
      - name: Benchmarks must not regress
        run: |
          jamjet-guardrails \
            --corpora-dir corpora \
            --json benchmarks.json \
            --md BENCHMARKS.md \
            --gate corpora/baselines.json
      # What stops the published numbers drifting from the code. The step above
      # has just rewritten both artifacts from a fresh measurement; if a change
      # moved a score, they now differ from what is committed and this fails
      # until the new numbers are committed in the same pull request.
      #
      # `git ls-files --error-unmatch` FIRST, and the order is load-bearing:
      # `git diff --exit-code` reports no difference for an UNTRACKED file, so
      # an artifact that was never committed, or one that someone added to
      # .gitignore, would pass the diff in silence. Asserting both paths are
      # tracked is what makes the diff mean anything.
      - name: Published artifacts must be committed and current
        run: |
          git ls-files --error-unmatch benchmarks.json BENCHMARKS.md
          git diff --exit-code benchmarks.json BENCHMARKS.md
      # The README quotes the headline table, so the README is a published
      # number too, and the two steps above cannot see it: they gate the SCORES
      # and they diff the generated files, and a README left behind by both
      # still shows figures the code no longer produces. It is checked against
      # the file that was regenerated two steps up rather than against the
      # committed one, so a stale README cannot be excused by a stale artifact.
      #
      # `test -s` on the extraction, and it is not decoration. Both sides are
      # cut out by the same sed address, so a change to the table's first
      # column heading empties BOTH files, and `diff` of two empty files is a
      # clean exit: the step would report success having compared nothing.
      - name: README must quote the current headline table
        run: |
          sed -n '/^| Check |/,/^$/p' BENCHMARKS.md | sed '/^$/d' > "$RUNNER_TEMP/generated.md"
          sed -n '/^| Check |/,/^$/p' README.md | sed '/^$/d' > "$RUNNER_TEMP/readme.md"
          test -s "$RUNNER_TEMP/generated.md"
          diff -u "$RUNNER_TEMP/generated.md" "$RUNNER_TEMP/readme.md"

  # One job per adapter, and NOT another leg of the matrix above. The adapters
  # are separate distributions with their own dependencies, their own release
  # tags and their own configuration files, and each pulls in a framework the
  # core does not know about. Folding them into `check` would install those
  # frameworks alongside the package whose whole claim is that it needs none.
  #
  # 3.12 only, and it is not a shortcut: `nemoguardrails` and `guardrails-ai`
  # both declare `>=3.10,<3.14`, so neither adapter can be installed on the 3.14
  # leg above, and each package's classifiers say so too.
  #
  # `ruff`, `mypy` and `pytest` all run from inside the package directory, so
  # each picks up that package's OWN configuration: ruff resolves the closest
  # pyproject.toml, and a bare `mypy` reads its `files` and its one
  # `ignore_missing_imports` override for its own framework. A path argument on
  # the mypy command line would override that list, which is the trap the `check`
  # job above already documents.
  nemo-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jamjet-guardrails-nemo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The core installed from THIS checkout, editable, so the adapter is
      # tested against the code in the pull request rather than against the last
      # release on PyPI. A dependency resolver would happily satisfy
      # `jamjet-guardrails>=0.3.0` from the index and hide a break.
      - run: pip install -e ../.. -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  validators-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jamjet-guardrails-validators
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ../.. -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  # The integration recipes in docs/recipes/, executed against the frameworks
  # they integrate with. Separate jobs, never legs of `check`: the core claims no
  # dependencies, and `check` runs tests/test_recipes.py with neither framework
  # installed, where every framework test skips.
  #
  # One job per framework because the two cannot share an environment:
  # openai-agents 0.23.1 requires openai>=3 and litellm 1.104.2 requires
  # openai<3. Each version below is the one its page says it was verified
  # against, and tests/test_recipes.py reads these lines to hold the pages to it.
  #
  # JAMJET_RECIPE_FRAMEWORK turns a missing import into a failure rather than a
  # skip. Without it a broken install step would leave this job green having run
  # nothing but the framework-free tests.
  recipe-openai-agents:
    runs-on: ubuntu-latest
    env:
      JAMJET_RECIPE_FRAMEWORK: openai-agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" "openai-agents==0.23.1"
      # The main job's mypy cannot see the recipe's framework types, so the
      # recipe is type-checked here, where they are installed.
      - run: mypy docs/recipes/openai_agents_guardrail.py
      - run: pytest -q tests/test_recipes.py

  recipe-litellm:
    runs-on: ubuntu-latest
    env:
      JAMJET_RECIPE_FRAMEWORK: litellm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The `proxy` extra because the recipe is a proxy guardrail and the tests
      # drive the proxy's own dispatch and config loader.
      - run: pip install -e ".[dev]" "litellm[proxy]==1.104.2"
      - run: mypy docs/recipes/litellm_guardrail.py
      - run: pytest -q tests/test_recipes.py
